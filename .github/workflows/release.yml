name: Release

on:
  push:
    tags:
      # Obsidian plugin tags have no v prefix: 1.0.0, not v1.0.0.
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require the tag to match manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            v*)
              echo "Obsidian release tags have no v prefix (got ${tag})." >&2
              exit 1
              ;;
          esac
          version="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${tag} does not match manifest.json version ${version}." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish the plugin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes="Oddava Notes ${tag}. Install with BRAT from oddava/obsidian-oddava-notes, or copy main.js, manifest.json, and styles.css into the plugins folder." \
            main.js manifest.json styles.css
