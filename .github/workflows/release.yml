name: Release

on:
  push:
    tags:
      # Obsidian plugin tags have no v prefix: 1.0.0, not v1.0.0.
      - '[0-9]*.[0-9]*.[0-9]*'
  # Run it by hand with a tag. If the tag exists (for example, a release
  # made in the GitHub UI), its files are attached to that release. If not,
  # the release and the tag are created on the commit the run is for.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as 1.1.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the tagged commit when the tag exists
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
          fi
          echo "Releasing $(git rev-parse --short HEAD) as $TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require the tag to match manifest.json
        run: |
          tag="$TAG"
          case "$tag" in
            v*)
              echo "Obsidian release tags have no v prefix (got ${tag})." >&2
              exit 1
              ;;
          esac
          version="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${tag} does not match manifest.json version ${version}." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish the plugin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$TAG"
          # A release made in the GitHub UI creates the tag first, so the
          # release can already exist here. Attach the files to it then.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --target="$(git rev-parse HEAD)" \
              --title="$tag" \
              --notes="Oddava Notes ${tag}. Install with BRAT from oddava/obsidian-oddava-notes, or copy main.js, manifest.json, and styles.css into the plugins folder." \
              main.js manifest.json styles.css
          fi
